# Rotating menu/wallboard for FullPageOS devices
version: 1
kind: kioskit.config
apply:
  files:
    # The rotating list of pages FullPageDashboard cycles through.
    - source: files/var/www/html/FullPageDashboard/urls.json
      target: /var/www/html/FullPageDashboard/urls.json
      mode: "0644"
      owner: root
      group: root
      # No restart: FullPageOS has no fullpagedashboard unit, and a missing
      # restart unit fails the apply. Any changed file makes the agent reboot
      # once, and FullPageDashboard reads urls.json at startup.
    # Device hostname. {{hostname}} is substituted from the device record on claim.
    - source: files/etc/hostname
      target: /etc/hostname
      mode: "0644"
      owner: root
      group: root
      reboot_required: true
